[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-analysis"
version = "0.1.0"
description = "CLI tool for analysing stock strategy reports using yfinance"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0",
    "pyarrow>=16.0",
    "yfinance>=0.2.0",
    "click>=8.0",
    "rich>=13.0",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
